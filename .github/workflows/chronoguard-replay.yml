name: ChronoGuard gateway replay

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "chronoguard/**"
      - ".github/workflows/chronoguard-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        working-directory: chronoguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan checkout for embedded credentials
        run: python scripts/audit_credentials.py
      - run: python -m pip install uv==0.11.26
      - run: uv sync --project verifier --frozen
      - run: uv run --project verifier pytest verifier/tests -q
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: chronoguard/bifrost/plugins/chronoguard/go.sum
      - name: Prepare the pinned gateway sources for Go and Docker
        run: |
          python bifrost/prepare.py --archive "$RUNNER_TEMP/chronoguard-source"
          echo "CG_BIFROST_SOURCE_CONTEXT=$RUNNER_TEMP/chronoguard-source" >> "$GITHUB_ENV"
      - run: go test -count=1 ./...
        working-directory: chronoguard/bifrost/plugins/chronoguard
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: chronoguard/console/package-lock.json
      - name: Run the console tests and build
        working-directory: chronoguard/console
        run: |
          npm ci
          npm test
          npm run build
      - run: uv run --project verifier python scripts/bootstrap.py
      - run: docker compose -f docker-compose.yml -f deploy/compose.replay.yml -p chronoguard-ci up --build -d --wait
      - run: uv run --project verifier python scripts/release_demo.py --output release-proof.json
      - name: Repeat the scenario with the same persistent stores
        run: uv run --project verifier python scripts/release_demo.py
      - run: python eval/run_eval.py --output release-replay-report.json
      - run: uv run --project verifier python eval/publisher_timeline.py --output publisher-timeline.json
      - run: uv run --project verifier python scripts/gateway_benchmark.py --output gateway-latency.json
      - run: uv run --with playwright==1.60.0 python -m playwright install --with-deps chromium
      - run: uv run --with playwright==1.60.0 python scripts/console_smoke.py --output browser-proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: chronoguard-replay
          path: |
            chronoguard/release-proof.json
            chronoguard/release-replay-report.json
            chronoguard/browser-proof.json
            chronoguard/publisher-timeline.json
            chronoguard/publisher-timeline.csv.gz
            chronoguard/gateway-latency.json
      - if: always()
        run: docker compose -f docker-compose.yml -f deploy/compose.replay.yml -p chronoguard-ci down
