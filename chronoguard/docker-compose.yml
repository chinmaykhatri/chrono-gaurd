# ChronoGuard — Docker Compose orchestration
# Built on Bifrost by Maxim AI and Tavily
#
# Usage:
#   cp .env.example .env   # fill in API keys
#   docker compose up -d --wait

services:
  # ---------- Data stores ----------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chronoguard
      POSTGRES_USER: ${POSTGRES_USER:-chronoguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chronoguard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronoguard"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------- Verifier (Python FastAPI) ----------
  verifier:
    build:
      context: ./verifier
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${VERIFIER_PORT:-8088}:8088"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://chronoguard:chronoguard@postgres:5432/chronoguard}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BIFROST_URL: ${BIFROST_URL:-http://bifrost:8002}
      BIFROST_API_KEY: ${BIFROST_API_KEY:-}
      CG_INTERNAL_KEY: ${CG_INTERNAL_KEY:-change-me-in-production-32chars-minimum}
      CG_CONFIG_PATH: /etc/chronoguard/chronoguard.yaml
      CG_CLOCK_MODE: ${CG_CLOCK_MODE:-real}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-chronoguard}
      EXTRACTOR_MODEL: ${EXTRACTOR_MODEL:-gpt-4o-mini}
      JUDGE_MODEL: ${JUDGE_MODEL:-gpt-4o-mini}
      JUDGE_ESCALATION_MODEL: ${JUDGE_ESCALATION_MODEL:-gpt-4o}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./chronoguard.yaml:/etc/chronoguard/chronoguard.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------- Console (React/Vite) ----------
  console:
    build:
      context: ./console
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${CONSOLE_PORT:-5173}:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      verifier:
        condition: service_healthy

  # ---------- Nginx reverse proxy ----------
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - verifier
      - console

volumes:
  pgdata:
  redisdata:

