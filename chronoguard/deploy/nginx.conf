resolver 127.0.0.11 valid=2s ipv6=off;

upstream gateway_backend {
    zone gateway_backend 64k;
    server bifrost:8002 resolve;
}
upstream verifier_backend {
    zone verifier_backend 64k;
    server verifier:8088 resolve;
}
upstream console_backend {
    zone console_backend 64k;
    server console:80 resolve;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 128k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
    location /internal/ { return 404; }
    location = /readyz {
        access_log off;
        proxy_pass http://verifier_backend;
    }
    location = /v1/chat/completions {
        proxy_pass http://gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header X-CG-Internal-Key "";
        proxy_buffering off;
        proxy_read_timeout 90s;
    }
    location = /v1/models {
        proxy_pass http://gateway_backend;
    }
    location /api/v1/ {
        proxy_pass http://verifier_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-CG-Internal-Key "";
        proxy_set_header X-CG-Internal "";
        proxy_set_header X-CG-Tenant "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
    }
    location / {
        proxy_pass http://console_backend;
    }
}
