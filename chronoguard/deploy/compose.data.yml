# Local integration data stores only; test ports are loopback-bound.
name: chronoguard-data
services:
  postgres:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_DB: chronoguard
      POSTGRES_USER: chronoguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/bootstrap.py first}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronoguard -d chronoguard"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
  redis:
    image: redis:7.4.12-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/bootstrap.py first}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run scripts/bootstrap.py first}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
volumes:
  postgres_data:
  redis_data:
